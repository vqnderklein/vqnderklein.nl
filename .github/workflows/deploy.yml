
name: Build & Deploy

on:
  workflow_run:
    workflows: ["Tests"]
    types:
      - completed

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest
    environment: deploy

    env:
      TAG: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u ${{ github.repository_owner }} \
            --password-stdin

      - name: Build and push frontend
        run: |
          IMAGE=ghcr.io/${{ github.repository }}-frontend

          docker build \
            -t $IMAGE:$TAG \
            -t $IMAGE:latest \
            ./frontend

          docker push $IMAGE:$TAG
          docker push $IMAGE:latest

      - name: Build and push backend
        run: |
          IMAGE=ghcr.io/${{ github.repository }}-backend

          docker build \
            -t $IMAGE:$TAG \
            -t $IMAGE:latest \
            ./backend

          docker push $IMAGE:$TAG
          docker push $IMAGE:latest

      - name: Verify published images
        run: |
          docker manifest inspect \
            ghcr.io/${{ github.repository }}-frontend:$TAG

          docker manifest inspect \
            ghcr.io/${{ github.repository }}-backend:$TAG

      - name: Copy docker-compose
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml"
          target: "/opt/vqnderklein.nl/"

      - name: Copy database init files
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "backend/db/init/."
          target: "/opt/vqnderklein.nl/"

      - name: Copy nginx configuration
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "nginx/default.conf"
          target: "/opt/vqnderklein.nl/"

      - name: Deploy
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            cd /opt/vqnderklein.nl/

            cat <<EOF > .env
            IMAGE_TAG=${{ env.TAG }}
            PEXELS_API_KEY=${{ secrets.PEXELS_API_KEY }}
            SMTP_HOST=${{ secrets.SMTP_HOST }}
            SMTP_PORT=${{ secrets.SMTP_PORT }}
            SMTP_USER=${{ secrets.SMTP_USER }}
            SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
            EOF

            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io \
              -u GH_USER \
              --password-stdin

            docker compose pull

            docker compose up -d \
              --force-recreate \
              --remove-orphans

            docker compose ps
